name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  deployment_status:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: helo-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pre-deploy validation
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and production build
        run: npm run validate
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: f9ampmu2
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SITE_URL: https://helo-sable-five.vercel.app

      - name: Browser smoke test Sanity Studio
        shell: bash
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: f9ampmu2
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SITE_URL: https://helo-sable-five.vercel.app
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          PORT=3333 npm run start > /tmp/helo-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 3 http://localhost:3333/ >/dev/null; then
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "Local Next.js server did not become ready."
              cat /tmp/helo-next.log || true
              exit 1
            fi
            sleep 2
          done

          if ! SMOKE_BASE_URL=http://localhost:3333 npm run smoke:studio; then
            echo "--- Next.js server log ---"
            cat /tmp/helo-next.log || true
            exit 1
          fi

      - name: Validate Sanity CORS for Vercel preview
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          SANITY_PROJECT_ID: f9ampmu2
          SANITY_DATASET: production
        run: |
          set -euo pipefail
          branch_slug=$(printf '%s' "$GITHUB_HEAD_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9-]+/-/g; s/^-+|-+$//g; s/-+/-/g')
          preview_origin="https://helo-git-${branch_slug}-pauliino1996-5063s-projects.vercel.app"
          url="https://${SANITY_PROJECT_ID}.api.sanity.io/v2026-09-01/data/query/${SANITY_DATASET}?query=count(*)"

          echo "Checking Sanity CORS for $preview_origin"
          headers=$(curl -sS -D - -o /tmp/sanity-preview-cors-body --max-time 20 \
            -H "Origin: $preview_origin" \
            "$url")

          allow_origin=$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}')
          allow_credentials=$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^access-control-allow-credentials:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}')

          echo "Access-Control-Allow-Origin: ${allow_origin:-missing}"
          echo "Access-Control-Allow-Credentials: ${allow_credentials:-missing}"

          if [ "$allow_origin" != "$preview_origin" ]; then
            echo "Sanity does not allow this Vercel Preview origin."
            echo "Recommended CORS entry: https://*-pauliino1996-5063s-projects.vercel.app with Allow credentials enabled."
            exit 1
          fi

          if [ "${allow_credentials,,}" != "true" ]; then
            echo "Sanity preview CORS is missing Allow credentials."
            exit 1
          fi

          echo "Sanity Vercel Preview CORS passed."

  production-qa:
    name: Production QA
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://helo-sable-five.vercel.app
      DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
      EXPECTED_SHA: ${{ github.event.deployment.sha || github.sha }}
      SANITY_PROJECT_ID: f9ampmu2
      SANITY_DATASET: production
    steps:
      - name: Verify Vercel deployment URL
        if: github.event_name == 'deployment_status' && github.event.deployment_status.environment_url != ''
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking Vercel deployment: $DEPLOYMENT_URL"
          status=$(curl -sSL -o /tmp/deployment.html -w '%{http_code}' --max-time 20 "$DEPLOYMENT_URL/")
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Deployment URL returned HTTP $status"
            exit 1
          fi
          echo "Deployment URL is reachable with HTTP $status."

      - name: Wait for expected commit to reach production
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for production commit $EXPECTED_SHA"

          for attempt in $(seq 1 30); do
            response=$(curl -sS --max-time 15 "$PRODUCTION_URL/api/health" || true)
            deployed_commit=$(printf '%s' "$response" | jq -r '.commit // empty' 2>/dev/null || true)
            health_status=$(printf '%s' "$response" | jq -r '.status // empty' 2>/dev/null || true)

            echo "Attempt $attempt/30: commit=${deployed_commit:-unavailable}, status=${health_status:-unavailable}"

            if [ "$deployed_commit" = "$EXPECTED_SHA" ] && [ "$health_status" = "ok" ]; then
              echo "Production is running the expected commit and health is OK."
              exit 0
            fi

            sleep 20
          done

          echo "Production did not become healthy for commit $EXPECTED_SHA within 10 minutes."
          exit 1

      - name: Smoke test homepage
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsSL --max-time 20 "$PRODUCTION_URL/")
          printf '%s' "$body" | grep -q '<main'
          printf '%s' "$body" | grep -q 'WhatsApp'
          echo "Homepage QA passed."

      - name: Smoke test Sanity Studio
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sSL -o /tmp/studio.html -w '%{http_code}' --max-time 20 "$PRODUCTION_URL/studio")
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Studio returned HTTP $status"
            exit 1
          fi
          echo "Studio QA passed with HTTP $status."

      - name: Validate Sanity preview diagnostics API
        shell: bash
        run: |
          set -euo pipefail
          http_status=$(curl -sS -o /tmp/sanity-diagnostics.json -w '%{http_code}' --max-time 20 "$PRODUCTION_URL/api/preview/diagnostics")
          echo "Sanity diagnostics HTTP: $http_status"
          jq '{status, projectId, dataset, siteUrl, checks, deployment}' /tmp/sanity-diagnostics.json || cat /tmp/sanity-diagnostics.json

          jq -e --arg sha "$EXPECTED_SHA" '
            .status == "ok" and
            .checks.publicQuery.ok == true and
            .checks.tokenConfigured.ok == true and
            .checks.authenticatedQuery.ok == true and
            .deployment.commit == $sha
          ' /tmp/sanity-diagnostics.json
          echo "Sanity preview diagnostics API passed."

      - name: Validate Sanity CORS with credentials
        shell: bash
        run: |
          set -euo pipefail
          url="https://${SANITY_PROJECT_ID}.api.sanity.io/v2026-09-01/data/query/${SANITY_DATASET}?query=count(*)"
          headers=$(curl -sS -D - -o /tmp/sanity-cors-body --max-time 20 \
            -H "Origin: $PRODUCTION_URL" \
            "$url")

          allow_origin=$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}')
          allow_credentials=$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^access-control-allow-credentials:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}')

          echo "Access-Control-Allow-Origin: ${allow_origin:-missing}"
          echo "Access-Control-Allow-Credentials: ${allow_credentials:-missing}"

          if [ "$allow_origin" != "$PRODUCTION_URL" ]; then
            echo "Sanity CORS origin does not match production URL."
            exit 1
          fi

          if [ "${allow_credentials,,}" != "true" ]; then
            echo "Sanity CORS is missing Allow credentials."
            exit 1
          fi

          echo "Sanity CORS with credentials passed."

      - name: Smoke test Sanity diagnostics tool
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sSL -o /tmp/studio-diagnostics.html -w '%{http_code}' --max-time 20 "$PRODUCTION_URL/studio/diagnostics")
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Sanity diagnostics tool returned HTTP $status"
            exit 1
          fi
          echo "Sanity diagnostics tool QA passed with HTTP $status."

      - name: Final production health check
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "$PRODUCTION_URL/api/health" | jq -e --arg sha "$EXPECTED_SHA" '
            .status == "ok" and
            .cms == "reachable" and
            .commit == $sha
          '
          echo "Final production QA passed."
