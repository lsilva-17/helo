name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: helo-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pre-deploy validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and production build
        run: npm run validate
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: f9ampmu2
          NEXT_PUBLIC_SANITY_DATASET: production

  production-qa:
    name: Production QA
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_URL: https://helo.vercel.app
    steps:
      - name: Wait for this commit to reach production
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for production commit $GITHUB_SHA"

          for attempt in $(seq 1 30); do
            response=$(curl -sS --max-time 15 "$PRODUCTION_URL/api/health" || true)
            deployed_commit=$(printf '%s' "$response" | jq -r '.commit // empty' 2>/dev/null || true)
            health_status=$(printf '%s' "$response" | jq -r '.status // empty' 2>/dev/null || true)

            echo "Attempt $attempt/30: commit=${deployed_commit:-unavailable}, status=${health_status:-unavailable}"

            if [ "$deployed_commit" = "$GITHUB_SHA" ] && [ "$health_status" = "ok" ]; then
              echo "Production is running the expected commit and health is OK."
              exit 0
            fi

            sleep 20
          done

          echo "Production did not become healthy for commit $GITHUB_SHA within 10 minutes."
          exit 1

      - name: Smoke test homepage
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsSL --max-time 20 "$PRODUCTION_URL/")
          printf '%s' "$body" | grep -q '<main'
          printf '%s' "$body" | grep -q 'WhatsApp'
          echo "Homepage QA passed."

      - name: Smoke test Sanity Studio
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sSL -o /tmp/studio.html -w '%{http_code}' --max-time 20 "$PRODUCTION_URL/studio")
          if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
            echo "Studio returned HTTP $status"
            exit 1
          fi
          echo "Studio QA passed with HTTP $status."

      - name: Final production health check
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 "$PRODUCTION_URL/api/health" | jq -e '
            .status == "ok" and
            .cms == "reachable" and
            .commit == env.GITHUB_SHA
          '
          echo "Final production QA passed."
